<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnapTok - TikTok Video Downloader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://pl30922437.effectivecpmnetwork.com/d9/e5/32/d9e5320e98edc365660081c4d91aacc1.js"></script>
    
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between font-sans antialiased overflow-x-hidden">

    <main class="w-full max-w-md mx-auto px-4 py-8 flex flex-col justify-center my-auto">
        <div class="text-center mb-6">
            <h1 class="text-3xl font-extrabold text-white mb-2">Download Without Limits.</h1>
        </div>

        <div class="bg-slate-900/85 border border-slate-800 rounded-3xl p-5 shadow-2xl space-y-4">
            <input type="text" id="urlInput" placeholder="https://vt.tiktok.com/..." class="w-full py-4 px-4 bg-slate-950/60 border border-slate-800 text-white rounded-2xl outline-none">
            
            <button id="downloadBtn" onclick="processDownload()" class="w-full py-4 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-2xl transition-all">
                Download
            </button>
        </div>

        <div id="loader" class="hidden text-center py-6 text-sm text-rose-400 font-bold">Processing...</div>

        <div id="resultBox" class="hidden mt-6 bg-slate-900/85 border border-slate-800 rounded-3xl p-5 space-y-4">
            <a id="downloadHD" href="#" target="_blank" download class="w-full py-3.5 bg-emerald-600 text-white text-center font-bold rounded-2xl block">
                Download HD Video (No Watermark)
            </a>
        </div>
    </main>

    <script>
    async function processDownload() {
        const url = document.getElementById('urlInput').value.trim();
        if(!url) return alert('Enter a link!');

        // 1. Open Ad
        window.open('https://omg10.com/4/11605228', '_blank');

        // 2. Fetch Video
        document.getElementById('loader').classList.remove('hidden');
        
        try {
            const response = await fetch('https://www.tikwm.com/api/?url=' + encodeURIComponent(url));
            const data = await response.json();
            
            if(data.code === 0) {
                const videoUrl = data.data.play;
                document.getElementById('downloadHD').href = videoUrl;
                document.getElementById('loader').classList.add('hidden');
                document.getElementById('resultBox').classList.remove('hidden');
            } else {
                alert('Error: Could not extract video.');
                document.getElementById('loader').classList.add('hidden');
            }
        } catch (e) {
            alert('Server error, try again.');
            document.getElementById('loader').classList.add('hidden');
        }
    }
    </script>
</body>
</html>
