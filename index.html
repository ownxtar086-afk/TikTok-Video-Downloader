<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnapTok - TikTok Video Downloader</title>
    <!-- Tailwind CSS CDN for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between font-sans antialiased overflow-x-hidden selection:bg-rose-500 selection:text-white">

    <!-- Background Glow Effects -->
    <div class="fixed top-0 left-1/4 w-72 h-72 bg-rose-600/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="fixed bottom-0 right-1/4 w-72 h-72 bg-pink-600/20 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Main Container (Mobile First & Centered) -->
    <main class="w-full max-w-md mx-auto px-4 py-8 flex flex-col justify-center my-auto">
        
        <!-- Brand Header -->
        <div class="text-center mb-6">
            <span class="inline-block px-3 py-1 bg-rose-500/10 border border-rose-500/20 text-rose-400 text-xs font-semibold rounded-full mb-3 tracking-wide uppercase">
                Zero Watermark AI
            </span>
            <h1 class="text-3xl font-extrabold tracking-tight text-white mb-2">
                Download Without Limits.
            </h1>
            <p class="text-sm text-slate-400">
                Paste any TikTok link to download ultra HD video instantly.
            </p>
        </div>

        <!-- Downloader Card -->
        <div class="bg-slate-900/80 backdrop-blur-xl border border-slate-800 rounded-3xl p-5 shadow-2xl space-y-4">
            
            <!-- Input Area -->
            <div class="space-y-2">
                <div class="relative">
                    <input type="text" id="urlInput" placeholder="https://vt.tiktok.com/..." class="w-full py-4 px-4 bg-slate-950/60 border border-slate-800 focus:border-rose-500 text-white placeholder-slate-500 text-sm rounded-2xl outline-none transition-all shadow-inner">
                </div>
            </div>

            <!-- Action Button with Click-Under Ad Integration -->
            <button id="downloadBtn" onclick="openAdAndFetch()" class="w-full py-4 bg-gradient-to-r from-rose-600 via-pink-600 to-rose-600 hover:opacity-95 text-white font-bold text-sm rounded-2xl transition-all active:scale-95 flex items-center justify-center space-x-2 shadow-lg shadow-rose-600/25">
                <span>Download</span>
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                </svg>
            </button>
        </div>

        <!-- Loader State (Hidden by default) -->
        <div id="loadingText" class="hidden text-center py-6 text-sm text-slate-400 space-y-2">
            <div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-slate-900 border border-slate-800 text-xs">
                <span class="w-2 h-2 rounded-full bg-rose-500 animate-ping"></span>
                Processing & Fetching...
            </div>
        </div>

        <!-- Result Box (Hidden by default) -->
        <div id="resultBox" class="hidden mt-6 bg-slate-900/80 border border-slate-800 rounded-3xl p-5 space-y-4">
            <div class="flex items-center justify-between text-xs text-slate-400 border-b border-slate-800 pb-3">
                <span id="status">Status: Ready</span>
                <span class="text-emerald-400 font-semibold bg-emerald-500/10 px-2 py-0.5 rounded-md">Ultra HD</span>
            </div>
            <div class="space-y-2">
                <a id="downloadHD" href="#" target="_blank" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 text-white text-center font-bold text-sm rounded-2xl transition-all flex items-center justify-center space-x-2 shadow-lg shadow-emerald-600/20">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    <span>Download HD Video (No Watermark)</span>
                </a>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center py-6 text-xs text-slate-500">
        <p>&copy; 2026 SnapTok. Designed for speed & revenue.</p>
    </footer>

    <!-- Script Section with Monetag Click-Under & Downloader Logic -->
    <script>
    function openAdAndFetch() {
        // Opens your Monetag Direct Link in a new tab when Download is clicked
        window.open('https://omg10.com/4/11605228', '_blank');
        
        // Triggers the processing / fetch logic
        fetchVideo();
    }

    function fetchVideo() {
        const url = document.getElementById('urlInput').value.trim();
        if(!url) {
            alert('Please paste a valid TikTok link first!');
            return;
        }

        // Show Loading & Hide Results temporarily
        document.getElementById('loadingText').classList.remove('hidden');
        document.getElementById('resultBox').classList.add('hidden');

        // Simulated fetch completion
        setTimeout(() => {
            document.getElementById('loadingText').classList.add('hidden');
            document.getElementById('resultBox').classList.remove('hidden');
            document.getElementById('downloadHD').href = url;
        }, 1200);
    }
    </script>
</body>
</html>
